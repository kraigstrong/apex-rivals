# Runs the tests on every pull request and every push to main, and fails on any build warning.
name: Tests

# Docs and the App Store listing don't go into the app, so a change of only those skips the run (main isn't protected,
# so nothing waits on the check).
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'appstore/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'appstore/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub's Xcode 27 image: macos-26 stops at Xcode 26.6, and only an app built with the iOS 27.1 SDK fills an iPhone
    # Duo's screens. Its newest simulator runtime, iOS 27.1, has only the iPhone Duo, so the tests run on one.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The Xcode the project is built with locally. Bump it here and in the README together.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # Simulator builds need no signing, and the runner has no certificates.
      STRICT: CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # The simulator SDK's stat cache, which a fresh runner otherwise spends minutes building before the first compile.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SDKStatCaches.noindex
          key: sdk-stat-cache-xcode-27.1
      # An iPhone the runner's simulator service actually lists (asking by name sometimes finds none), booted while the
      # Release build runs: booting, and the test run's wait for a just-booted device, took minutes of their own.
      - name: Build (Release), booting a simulator meanwhile
        id: simulator
        run: |
          scripts/ci-simulator.sh > "$RUNNER_TEMP/simulator" &
          booting=$!
          xcodebuild build -project Apex.xcodeproj -scheme Apex -configuration Release \
            -destination 'generic/platform=iOS Simulator' $STRICT
          # A failed pick fails the step here, rather than testing on no device.
          wait $booting
          echo "udid=$(cat "$RUNNER_TEMP/simulator")" >> "$GITHUB_OUTPUT"
      - name: Test (Debug)
        run: >
          xcodebuild test -project Apex.xcodeproj -scheme Apex
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' $STRICT
